<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Amoroso - Foto Rebote</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Dancing Script', cursive; overflow: hidden; color: #330000; background: #ffb3d6; }

        /* Fondo degradado animado */
        .background-gradient {
            position: fixed; inset: 0;
            background: linear-gradient(135deg, #ff6bda, #ffb3d6, #ff99cc, #ff6699);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            z-index: -2;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Navbar */
        nav {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(255,182,193,0.5); padding: 8px 30px; border-radius: 30px; z-index:1000;
        }
        nav ul { list-style:none; display:flex; gap:40px; }
        nav a {
            text-decoration:none; color:white; font-size:1.3em; font-weight:700;
            padding:5px 15px; border-radius:15px; transition:0.3s;
        }
        nav a:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }

        /* Corazones cayendo */
        #hearts-container { position: fixed; inset:0; pointer-events:none; z-index:500; }
        .heart { position:absolute; width:20px; height:20px; background:#ff0066; transform:rotate(45deg); animation: fall linear infinite; }
        .heart::before, .heart::after { content:''; position:absolute; width:20px; height:20px; background:#ff0066; border-radius:50%; }
        .heart::before { top:-10px; left:0; } .heart::after { left:10px; top:0; }
        @keyframes fall { 0% { transform:translateY(-50px) rotate(45deg); opacity:1; } 100% { transform:translateY(110vh) rotate(45deg); opacity:0; } }

        /* Canvas del Juego */
        #gameCanvas { display:block; width:100%; height:100vh; cursor: grab; z-index:1; position:relative; }

        /* Mensaje Diario */
        .daily-message {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.6); padding: 10px 20px; border-radius: 20px;
            font-size: 1.5rem; font-weight: bold; z-index: 1000; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="background-gradient"></div>
    <div id="hearts-container"></div>
    <div class="daily-message" id="dailyMessage">TE AMOOO ILHAMMM</div>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="momentos.html">Momentos</a></li>
            <li><a href="tiempo.html">Tiempo</a></li>
            <li><a href="juego.html">Juego</a></li>
        </ul>
    </nav>

    <canvas id="gameCanvas"></canvas>

    <script>
        // 1. CONFIGURACIÓN CANVAS
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 2. CARGAR IMAGEN
        const img = new Image();
        img.src = '5773780779069541719.jpg'; 

        // 3. ESTADO DE LA PELOTA
        const ball = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            vx: 4,
            vy: 4,
            radius: 65,
            isDragging: false,
            offsetX: 0,
            offsetY: 0,
            lastX: 0,
            lastY: 0
        };

        // 4. CORAZONES DE FONDO
        const heartsContainer = document.getElementById('hearts-container');
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.style.left = Math.random() * 100 + 'vw';
            const size = 15 + Math.random() * 15;
            heart.style.width = heart.style.height = size + 'px';
            heart.style.animationDuration = (3 + Math.random() * 4) + 's';
            heartsContainer.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 400);

        // 5. LÓGICA DE DIBUJO Y MOVIMIENTO
        function update() {
            if (!ball.isDragging) {
                // Movimiento básico
                ball.x += ball.vx;
                ball.y += ball.vy;

                // Fricción suave
                ball.vx *= 0.99;
                ball.vy *= 0.99;

                // REBOTE BORDES
                if (ball.x + ball.radius > canvas.width) {
                    ball.x = canvas.width - ball.radius;
                    ball.vx = -Math.abs(ball.vx);
                } else if (ball.x - ball.radius < 0) {
                    ball.x = ball.radius;
                    ball.vx = Math.abs(ball.vx);
                }

                if (ball.y + ball.radius > canvas.height) {
                    ball.y = canvas.height - ball.radius;
                    ball.vy = -Math.abs(ball.vy);
                } else if (ball.y - ball.radius < 0) {
                    ball.y = ball.radius;
                    ball.vy = Math.abs(ball.vy);
                }

                // Velocidad mínima (para que no se pare)
                if (Math.abs(ball.vx) < 1 && Math.abs(ball.vy) < 1) {
                    ball.vx = (Math.random() - 0.5) * 5;
                    ball.vy = (Math.random() - 0.5) * 5;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
            
            if (img.complete) {
                ctx.drawImage(img, ball.x - ball.radius, ball.y - ball.radius, ball.radius * 2, ball.radius * 2);
            } else {
                ctx.fillStyle = '#ff6bda';
                ctx.fill();
            }
            ctx.restore();
            
            update();
            requestAnimationFrame(draw);
        }

        // 6. EVENTOS DE RATÓN (LANZAMIENTO)
        canvas.addEventListener('mousedown', (e) => {
            const dx = e.clientX - ball.x;
            const dy = e.clientY - ball.y;
            if (Math.sqrt(dx*dx + dy*dy) < ball.radius) {
                ball.isDragging = true;
                ball.offsetX = dx;
                ball.offsetY = dy;
                ball.lastX = e.clientX;
                ball.lastY = e.clientY;
                canvas.style.cursor = 'grabbing';
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (ball.isDragging) {
                // Calcular velocidad del lanzamiento
                ball.vx = e.clientX - ball.lastX;
                ball.vy = e.clientY - ball.lastY;
                
                // Mover pelota con el ratón
                ball.x = e.clientX - ball.offsetX;
                ball.y = e.clientY - ball.offsetY;
                
                ball.lastX = e.clientX;
                ball.lastY = e.clientY;
            }
        });

        window.addEventListener('mouseup', () => {
            if (ball.isDragging) {
                ball.isDragging = false;
                canvas.style.cursor = 'grab';
                
                // Limitador de velocidad
                const maxS = 25;
                ball.vx = Math.max(-maxS, Math.min(maxS, ball.vx));
                ball.vy = Math.max(-maxS, Math.min(maxS, ball.vy));
            }
        });

        // 7. MENSAJES
        const messages = ["TE AMOOO ILHAMMM", "Te amo mi bebe 🌹", "ISRMANNNNNN✨", "Btata M9Lia💕", "Eres mi novia?💝"];
        const msgEl = document.getElementById('dailyMessage');
        setInterval(() => {
            msgEl.textContent = messages[Math.floor(Math.random() * messages.length)];
        }, 8000);

        // Iniciar juego
        img.onload = () => draw();
        if (img.complete) draw();
        
    </script>
</body>
</html>
